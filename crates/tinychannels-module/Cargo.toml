[package]
rust-version = "1.94"
name = "tinychannels-module"
version.workspace = true
edition = "2024"
license = "GPL-3.0-only"
description = "Trusted TinyBus module adapter for TinyChannels."
repository = "https://github.com/tinyhumansai/tinychannels"
publish = false

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
# The provider stack. This is the whole point of the module: these dependencies
# live in the loaded `cdylib` instead of in every host binary.
# The WhatsApp Web stack (whatsapp-rust, wacore, waproto) is optional: it is
# pulled in by this crate's own `whatsapp-web` feature, which is on by default
# so the released cdylib carries it. Without the feature `StartChannel`'s
# factory compiles its gate-off branch, returns no provider and the request
# fails as `NotConfigured`. Hosts that link the module only to exercise the
# other providers (for example a test fixture) can opt out with
# `default-features = false`.
tinychannels = { path = "../..", features = ["email", "lark", "relay-websocket"] }
# The transport-free vocabulary shared with the host.
tinychannels-bus = { path = "../tinychannels-bus" }
# TinyBus provides the typed service interface and dynamic module host ABI.
tinybus = { version = ">=0.1.4, <0.2", default-features = false, features = ["macros", "modules"] }
# The module-side SDK owns its runtime and exports the stable C entrypoints.
tinybus-module = ">=0.1.4, <0.2"
# Provider listen loops are long-lived tasks the module owns.
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
# Storage over the bus: the module reaches host storage through the same port
# traits a linked library gets, never through per-module persistence callbacks.
tinystoragedrivers-api = { git = "https://github.com/tinyhumansai/tinystoragedrivers", rev = "05eaada962decbab33bafa4763d2bd1a67f6b456" }
tinystoragedrivers-types = { git = "https://github.com/tinyhumansai/tinystoragedrivers", rev = "05eaada962decbab33bafa4763d2bd1a67f6b456" }
tinystoragedrivers-busproxy = { git = "https://github.com/tinyhumansai/tinystoragedrivers", rev = "05eaada962decbab33bafa4763d2bd1a67f6b456" }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
sha2 = "0.11"
hex = "0.4"
anyhow = "1"
# Diagnostics. A provider that stops receiving is otherwise silent.
tracing = "0.1"
log = "0.4"
async-trait = "0.1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tinybus = { version = ">=0.1.4, <0.2", default-features = false, features = ["test-support"] }
tinystoragedrivers-testkit = { git = "https://github.com/tinyhumansai/tinystoragedrivers", rev = "05eaada962decbab33bafa4763d2bd1a67f6b456" }
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }
serde_json = "1"
futures-util = "0.3"
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
base64 = "0.23"

[features]
default = ["whatsapp-web"]
# Builds the WhatsApp Web provider into the module (on by default).
whatsapp-web = ["tinychannels/whatsapp-web"]
linked = ["static-link"]
static-link = []
test-support = []
